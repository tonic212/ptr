name: Windows build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.x'
      - name: Build WPF app and core
        run: dotnet build PokerCompanion.sln --configuration Release
      - name: Recognition regression checks
        run: dotnet run --project PokerCompanion.Core.Tests --configuration Release --no-build
